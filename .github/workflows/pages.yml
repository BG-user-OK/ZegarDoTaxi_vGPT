name: Deploy static PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static PWA artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-dist
          mkdir -p pages-dist
          cp index.html pages-dist/
          cp sw.js pages-dist/
          cp manifest.json pages-dist/
          cp icon-192.png pages-dist/
          cp icon-512.png pages-dist/
          cp icon-512-maskable.png pages-dist/
          cp .nojekyll pages-dist/
          cp -R Photos pages-dist/Photos

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 60
          reporting_interval: 10000

      - name: Verify public GitHub Pages version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' index.html | head -n 1)"
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html"
          echo "Expecting ${expected} at ${url}"
          for attempt in {1..36}; do
            body="$(curl -fsSL "${url}?pagesVerify=${GITHUB_RUN_ID}-${attempt}-$(date +%s)" || true)"
            if printf '%s' "$body" | grep -q "$expected"; then
              echo "Published ${expected} confirmed."
              exit 0
            fi
            echo "Attempt ${attempt}: ${expected} not visible yet."
            sleep 10
          done
          echo "Expected ${expected} was not visible at ${url}."
          exit 1
